# Runs speaker in its hardened container: `docker compose up -d --build` here (or `mise run speaker:up`).
# Edit speaker/.env, not this file, for PUBLIC_URL, PORT, PROXY_PORT and SSH_PORT (see .env.example). State (config,
# encrypted secrets, audit log) lives in the named volume `data`; open PUBLIC_URL/admin to set the owner password.
# Speaker's own port and the secrets proxy are published on 127.0.0.1 only, which is right when bottle runs on this
# machine or in a container on this Docker network. When bottle runs on another machine, publish PROXY_PORT (and keep
# SSH_PORT reachable) on an address that machine can reach, such as the LAN or tailnet address, never the public
# internet. For example change
#   - "127.0.0.1:${PROXY_PORT:?...}:${PROXY_PORT:?...}"
# to
#   - "100.64.0.10:${PROXY_PORT:?...}:${PROXY_PORT:?...}"
services:
  speaker:
    build:
      # The pnpm workspace root; set LOCKED: "1" under args for the tested lockfile set.
      context: ..
      dockerfile: speaker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env to the browser-facing URL}
      SSH_PORT: ${SSH_PORT:?Set SSH_PORT in .env}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
      # The secrets proxy (PROXY_PORT in .env, published on the same port number).
      - "127.0.0.1:${PROXY_PORT:?Set PROXY_PORT in .env}:${PROXY_PORT:?Set PROXY_PORT in .env}"
      # The jump server, which listens only while an SSH or folder grant is active. Published on every address; put an
      # address in front (as above) to narrow it.
      - "${SSH_PORT:?Set SSH_PORT in .env}:${SSH_PORT:?Set SSH_PORT in .env}"
    volumes:
      - data:/data
    read_only: true
    # tini reaps Chromium's processes; SETUID and SETGID let the start script switch to the `node` and `browser` users.
    init: true
    cap_drop: [ALL]
    # SETUID and SETGID let the start script switch to the `node` and `browser` users. SYS_CHROOT: Chromium's sandbox
    # chroots inside its own user namespace, and without it in the bounding set Chromium's zygote dies at start.
    cap_add: [SETUID, SETGID, SYS_CHROOT]
    # Docker's default seccomp profile plus clone, unshare and setns for Chromium's sandbox.
    security_opt: [no-new-privileges:true, seccomp=./chrome-seccomp.json]
    tmpfs: [/tmp]
    # Chromium uses /dev/shm for page rendering; Docker's 64 MB default is too small for it.
    shm_size: 256m

volumes:
  data:
