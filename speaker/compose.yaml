services:
  speaker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env to the browser-facing URL}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
      # The secrets proxy (listens only when PROXY_PORT is set in .env; keep it equal to this port).
      - "127.0.0.1:${PROXY_PORT:-3128}:${PROXY_PORT:-3128}"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

volumes:
  data:
