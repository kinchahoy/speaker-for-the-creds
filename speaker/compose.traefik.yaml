# Optional override for the existing home-server Traefik/TinyAuth stack.
services:
  speaker:
    environment:
      PUBLIC_URL: https://speaker.example.com
    networks: [default, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.speaker.rule: Host(`speaker.example.com`)
      traefik.http.routers.speaker.entrypoints: websecure
      traefik.http.routers.speaker.service: speaker
      traefik.http.routers.speaker-admin.rule: Host(`speaker.example.com`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      traefik.http.routers.speaker-admin.entrypoints: websecure
      traefik.http.routers.speaker-admin.priority: "100"
      traefik.http.routers.speaker-admin.service: speaker
      traefik.http.routers.speaker-admin.middlewares: tinyauth@docker
      traefik.http.services.speaker.loadbalancer.server.port: "3000"
      traefik.http.services.speaker.loadbalancer.responseforwarding.flushinterval: "-1ms"

networks:
  proxy:
    external: true
