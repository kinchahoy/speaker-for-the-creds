[tools]
node = "26.13.0"
pnpm = "12.16.1"

[tasks.install]
description = "Install both packages' dependencies"
run = ["pnpm -C speaker install", "pnpm -C bottle-school install"]

[tasks.check]
description = "Typecheck both packages and lint speaker"
run = [
  "cd speaker && pnpm exec tsc --noEmit && pnpm exec biome check .",
  "cd bottle-school && pnpm exec tsc --noEmit",
]

[tasks.ci]
description = "Typecheck, lint, and test both packages"
depends = ["check", "test"]

[tasks.format]
description = "Format speaker with Biome"
dir = "speaker"
run = "pnpm exec biome check --write ."

[tasks.test]
description = "Run both packages' tests"
run = [
  "cd speaker && node --test --test-timeout=15000 test/*.test.ts",
  "cd bottle-school && node --test test/*.test.ts",
]

[tasks.speaker]
description = "Run speaker with live reload"
dir = "speaker"
run = "node --watch --env-file-if-exists=.env server.ts"

[tasks.bottle]
description = "Run the bottle-school service"
dir = "bottle-school"
run = "./start.sh"

[tasks.guest-build]
description = "Build a guest image: mise run guest-build pi-v5-guest"
dir = "bottle-school"
run = "guest/build.sh"

[tasks.bottle-cli]
description = "Run the bottle CLI: mise run bottle-cli register|run|ls|attach|stop"
dir = "bottle-school"
run = "node src/cli.ts"

[tasks.setup]
description = "Create bottle-school/config.json and its directories (env: LLM_UPSTREAM=host:port LLM_MODEL=id)"
dir = "bottle-school"
run = "node setup.ts"

[tasks.doctor]
description = "Check this host for bottle-school prerequisites (Linux or macOS)"
dir = "bottle-school"
run = "./doctor.sh"

[tasks.ssh-ca]
description = "Create speaker's SSH user CA keypair: mise run ssh-ca [path], default speaker/data/ssh_ca"
run = '''
f="${usage_path:-speaker/data/ssh_ca}"
test ! -e "$f" || { echo "$f exists; refusing to overwrite a CA that hosts may already trust" >&2; exit 1; }
mkdir -p -m 700 "$(dirname "$f")"
ssh-keygen -q -t ed25519 -N '' -C speaker-ssh-ca -f "$f"
echo "CA private key: $f (set SSH_CA_KEY to it). Public key for hosts:"
cat "$f.pub"
'''
usage = 'arg "[path]"'

[tasks.speaker-up]
description = "Build and run speaker in its hardened container (needs speaker/.env)"
dir = "speaker"
run = "docker compose up -d --build"
