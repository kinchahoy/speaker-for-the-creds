[tools]
node = "26.13.0"
pnpm = "12.16.1"

[tasks.install]
description = "Install the newest release of every dependency; pnpm-lock.yaml is left alone"
# `install --no-lockfile` would reuse what is installed; `update` re-resolves, and lockfile=false keeps the lockfile out of it.
run = "pnpm update --recursive --config.lockfile=false"

[tasks."install:locked"]
description = "Install exactly the tested set in pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks.lock]
description = "Move pnpm-lock.yaml to the newest releases (only when the owner asks)"
run = "pnpm update --recursive"

[tasks.init]
description = "Guided setup: mise run init [speaker | bottle] (no name sets up both on this machine; --yes and flags skip the prompts)"
depends = ["install"]
# The prompts need the terminal itself.
raw = true
run = "node init.ts"

[tasks.check]
description = "Typecheck, lint (oxlint), and format-check (oxfmt) both packages"
run = "pnpm --recursive exec sh -c 'tsc --noEmit && oxlint && oxfmt --check'"

[tasks.ci]
description = "Typecheck, lint, and test both packages"
depends = ["check", "test"]

[tasks.format]
description = "Format both packages with oxfmt"
run = "pnpm --recursive exec oxfmt"

[tasks.test]
description = "Run both packages' tests"
run = "pnpm --recursive --workspace-concurrency=1 exec sh -c 'node --test --test-timeout=30000 test/*.test.ts'"

[tasks.speaker]
description = "Run speaker with live reload"
dir = "speaker"
run = "node --watch --env-file-if-exists=.env server.ts"

[tasks.bottle]
description = "Run bottle: mise run bottle run|ls|attach|stop|down|serve|build|register (mise run bottle help)"
dir = "bottle"
run = "node src/cli.ts"

[tasks."speaker:up"]
description = "Build and run speaker in its hardened container (needs speaker/.env)"
dir = "speaker"
run = "docker compose up -d --build"

[tasks."bottle:logs"]
description = "Follow bottle's log"
run = 'tail -f "${BOTTLE_HOME:-$HOME/.bottle}/bottle.log"'
