[tools]
node = "26.13.0"
pnpm = "12.16.1"

[tasks.install]
description = "Install both packages' dependencies"
run = ["pnpm -C speaker install", "pnpm -C bottle-school install"]

[tasks.init]
description = "Guided setup: mise run init [speaker | bottle-school] (no name sets up both on this machine; --yes and flags skip the prompts)"
depends = ["install"]
# The prompts need the terminal itself.
raw = true
run = "node init.ts"

[tasks.check]
description = "Typecheck, lint (oxlint), and format-check (oxfmt) both packages"
run = [
  "cd speaker && pnpm exec tsc --noEmit && pnpm exec oxlint && pnpm exec oxfmt --check",
  "cd bottle-school && pnpm exec tsc --noEmit && pnpm exec oxlint && pnpm exec oxfmt --check",
]

[tasks.ci]
description = "Typecheck, lint, and test both packages"
depends = ["check", "test"]

[tasks.format]
description = "Format both packages with oxfmt"
run = ["cd speaker && pnpm exec oxfmt", "cd bottle-school && pnpm exec oxfmt"]

[tasks.test]
description = "Run both packages' tests"
run = [
  "cd speaker && node --test --test-timeout=15000 test/*.test.ts",
  "cd bottle-school && node --test --test-timeout=30000 test/*.test.ts",
]

[tasks.speaker]
description = "Run speaker with live reload"
dir = "speaker"
run = "node --watch --env-file-if-exists=.env server.ts"

[tasks.bottle-school]
description = "Run the bottle-school service"
dir = "bottle-school"
run = "./start.sh"

[tasks."bottle-school:guest-build"]
description = "Build the guest image and load it into microsandbox: mise run bottle-school:guest-build bottle-school-guest"
dir = "bottle-school"
run = "guest/build.sh"


[tasks."bottle-school:cli"]
description = "Run the bottle-school CLI: mise run bottle-school:cli register|run|ls|attach|stop"
dir = "bottle-school"
run = "node src/cli.ts"

[tasks."bottle-school:doctor"]
description = "Check this host for bottle-school prerequisites (Linux or macOS)"
dir = "bottle-school"
run = "./doctor.sh"

[tasks."speaker:up"]
description = "Build and run speaker in its hardened container (needs speaker/.env)"
dir = "speaker"
run = "docker compose up -d --build"
