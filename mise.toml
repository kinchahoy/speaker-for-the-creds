[tools]
node = "26.13.0"
pnpm = "12.16.1"

[tasks.install]
description = "Install both packages' dependencies"
run = ["pnpm -C speaker install", "pnpm -C bottle install"]

[tasks.init]
description = "Guided setup: mise run init [speaker | bottle] (no name sets up both on this machine; --yes and flags skip the prompts)"
depends = ["install"]
# The prompts need the terminal itself.
raw = true
run = "node init.ts"

[tasks.check]
description = "Typecheck, lint (oxlint), and format-check (oxfmt) both packages"
run = [
  "cd speaker && pnpm exec tsc --noEmit && pnpm exec oxlint && pnpm exec oxfmt --check",
  "cd bottle && pnpm exec tsc --noEmit && pnpm exec oxlint && pnpm exec oxfmt --check",
]

[tasks.ci]
description = "Typecheck, lint, and test both packages"
depends = ["check", "test"]

[tasks.format]
description = "Format both packages with oxfmt"
run = ["cd speaker && pnpm exec oxfmt", "cd bottle && pnpm exec oxfmt"]

[tasks.test]
description = "Run both packages' tests"
run = [
  "cd speaker && node --test --test-timeout=15000 test/*.test.ts",
  "cd bottle && node --test --test-timeout=30000 test/*.test.ts",
]

[tasks.speaker]
description = "Run speaker with live reload"
dir = "speaker"
run = "node --watch --env-file-if-exists=.env server.ts"

[tasks.bottle]
description = "Run bottle: mise run bottle serve|build|register|run|ls|attach|stop (mise run bottle help)"
dir = "bottle"
run = "node src/cli.ts"

[tasks."speaker:up"]
description = "Build and run speaker in its hardened container (needs speaker/.env)"
dir = "speaker"
run = "docker compose up -d --build"
