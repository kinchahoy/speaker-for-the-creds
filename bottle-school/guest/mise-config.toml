# System-wide tools for the v5 guest. Each build takes the latest release, except the pinned
# Pi extensions.
[tools]
node = "latest"
go = "latest"
uv = "latest"
ripgrep = "latest"
fd = "latest"
ast-grep = "latest"
yq = "latest"
gh = "latest"
shfmt = "latest"
shellcheck = "latest"
ruff = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
# Pi extensions, pinned so a rebuild never pulls unreviewed extension code; update them deliberately.
# Always on (the Dockerfile links them into /opt/pi-extensions; pi-launch loads them in every task):
"npm:pi-loop-police" = "1.14.1"
"npm:pi-token-speed" = "0.12.0"
# Opt-in (linked to /opt/pi-plugins/<name>; catalog.json `extensions` entries name those paths):
"npm:@juicesharp/rpiv-ask-user-question" = "2.15.0"
"npm:pi-web-access" = "0.47.0"
# 0.7.9 is the last pi-cc-* release published by GitHub Actions with provenance; 0.8.0 (2026-11-10) was
# published by hand without it, so aube's no-downgrade trust policy refuses it. Move on only to a release with provenance.
"npm:pi-cc-loop" = "0.7.9"
"npm:pi-cc-monitor" = "0.7.9"
"npm:typescript" = "latest"
"npm:pnpm" = "latest"
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"
# Documents
pandoc = "latest"
typst = "latest"
# Developer command-line tools
just = "latest"
hyperfine = "latest"
delta = "latest"
bat = "latest"
watchexec = "latest"
ty = "latest"
