packages:
  - speaker
  - bottle

# Dependencies both packages use, declared once (each package names them as "catalog:").
# Everything floats to the newest release; `mise run install:locked` installs the tested set in pnpm-lock.yaml.
catalog:
  "@clack/prompts": latest
  "@hono/node-server": latest
  commander: latest
  hono: latest
  zod: latest
  "@types/node": latest
  oxfmt: latest
  oxlint: latest
  typescript: latest

# agent-browser's postinstall only links its native binary; its launcher does that on first use.
allowBuilds:
  agent-browser: false
  cpu-features: set this to true or false
  ssh2: set this to true or false
